name: Daily Index Valuation Fetcher

on:
  schedule:
    # 每天北京时间 16:30 (UTC 8:30) 自动运行
    - cron: '30 8 * * *'
  workflow_dispatch: # 支持在 GitHub 手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: 运行抓取脚本
        run: python fetch_data.py

      - name: 提交更新后的 data.json 到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git commit -m "auto: 自动更新指数估值数据 [$(date +'%Y-%m-%d')]" || exit 0
          git push
