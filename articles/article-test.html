<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="明朝那些事：一个人走完 276 年。石悦与《明朝那些事》的读后感。">
    <title>明朝那些事</title>
    
    <!-- 引入 Tailwind CSS 并激活排版插件 -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- 引入 Markdown 解析器 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 FontAwesome 图标库 -->
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#3B82F6', // 保持您的主色调，用于细微点缀
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'] // Stripe 标志性的无衬线字体
            }
          }
        }
      };
    </script>

    <style type="text/tailwindcss">
        /* ==================== Stripe 风格的极致排版引擎 ==================== */
        .prose { 
            max-width: 65ch; /* 黄金阅读宽度限制 */
            margin: 0 auto; 
        }
        /* 标题：紧凑、加黑、去除多余装饰 */
        .prose h1 { @apply text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight mb-8; }
        .prose h2 { @apply text-2xl font-semibold text-slate-900 tracking-tight border-b border-slate-200 pb-3 mt-14 mb-6; }
        .prose h3 { @apply text-xl font-medium text-slate-900 mt-10 mb-4 tracking-tight; }
        
        /* 正文：字号略微放大，颜色调为极易阅读的深石板灰 */
        .prose p { @apply text-slate-600 leading-loose text-[17px] mb-6; }
        .prose strong { @apply font-semibold text-slate-900; }
        
        /* 引用块：极细左边框，极浅背景，取消倾斜 */
        .prose blockquote { @apply border-l-2 border-primary bg-slate-50/80 px-6 py-4 rounded-r-md text-slate-700 not-italic my-10 text-[17px]; }
        
        /* 列表：精致的间距 */
        .prose ul, .prose ol { @apply my-6 text-slate-600 text-[17px] leading-relaxed; }
        .prose li { @apply mb-2; }
        
        /* 图片：细腻边框与微阴影 */
        .prose img { @apply rounded-lg border border-slate-200 shadow-sm mx-auto my-12; }
        
        /* 表格：极其干净的线条排版 */
        .prose table { @apply w-full text-left border-collapse my-10 text-sm md:text-base; }
        .prose thead { @apply border-b border-slate-300 text-slate-900 bg-white; }
        .prose th { @apply py-4 px-4 font-semibold; }
        .prose td { @apply py-4 px-4 border-b border-slate-100 text-slate-600; }
        .prose tr:hover td { @apply bg-slate-50/50 transition-colors; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- 极细的顶部进度条 -->
    <div class="fixed top-0 left-0 h-[3px] bg-primary z-[100] transition-all duration-150 ease-out" id="reading-progress" style="width: 0%;"></div>

    <!-- 极简导航栏 (融入背景，不喧宾夺主) -->
    <nav class="bg-slate-50 border-b border-slate-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 max-w-4xl h-16 flex items-center justify-between">
            <a href="../index.html" class="text-slate-500 hover:text-slate-900 transition-colors flex items-center font-medium text-sm">
                <i class="fas fa-arrow-left mr-2"></i> 返回个人主页
            </a>
            <div class="text-xs text-slate-400 font-medium tracking-widest uppercase">
                Notes & Thinking
            </div>
        </div>
    </nav>

    <!-- 核心文章容器 -->
    <main class="container mx-auto px-4 py-12 md:py-20 max-w-4xl mb-10">
        <!-- 干净的纯白卡片，细腻的一像素边框 -->
        <article class="bg-white p-8 md:p-16 rounded-xl border border-slate-200 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.05)]">
            
            <div id="content-container" class="prose">
                <!-- 骨架屏加载动画 -->
                <div class="animate-pulse flex flex-col space-y-6">
                    <div class="h-10 bg-slate-100 rounded-md w-3/4 mb-6"></div>
                    <div class="space-y-4">
                        <div class="h-4 bg-slate-50 rounded w-full"></div>
                        <div class="h-4 bg-slate-50 rounded w-full"></div>
                        <div class="h-4 bg-slate-50 rounded w-5/6"></div>
                    </div>
                </div>
            </div>

            <!-- 极简社交收尾 -->
            <div class="mt-20 pt-8 border-t border-slate-100 flex items-center justify-between">
                <span class="text-sm text-slate-400">最后更新于 2026.06</span>
                <div class="flex space-x-4">
                   <button id="share-btn" class="text-slate-400 hover:text-primary transition-colors" title="分享这篇文章"><i class="fas fa-share-alt"></i></button>
                </div>
            </div>
        </article>
    </main>

    <!-- 右下角悬浮火箭 (缩小尺寸并调淡颜色，以适配极简风格) -->
    <div id="floating-widget" class="fixed bottom-8 right-8 z-50 transition-all duration-500 transform translate-y-20 opacity-0 pointer-events-none">
        <button id="back-to-top" class="w-10 h-10 bg-slate-800 hover:bg-primary text-white rounded-full shadow-md flex items-center justify-center transition-colors focus:outline-none">
            <i class="fas fa-arrow-up text-sm"></i>
        </button>
    </div>

    <!-- 交互逻辑与渲染引擎 -->
    <script>
        const targetArticle = 'mingchao.md';

        fetch(targetArticle)
            .then(response => {
                if (!response.ok) throw new Error('网络请求失败');
                return response.text();
            })
            .then(markdownText => {
                document.getElementById('content-container').innerHTML = marked.parse(markdownText);
                
                // 表格横向滚动防护
                const tables = document.querySelectorAll('#content-container table');
                tables.forEach(table => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'overflow-x-auto w-full';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                });
            })
            .catch(error => {
                document.getElementById('content-container').innerHTML = `
                    <div class="py-10">
                        <p class="text-red-500 font-medium">文章拉取失败，请检查文件路径或本地服务器环境。</p>
                    </div>
                `;
            });

        // 阅读进度条
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('reading-progress').style.width = scrolled + '%';
        });

// 4. 文章分享功能逻辑
        const shareBtn = document.getElementById('share-btn');
        if (shareBtn) {
            shareBtn.addEventListener('click', async () => {
                // 打包要分享的数据包
                const shareData = {
                    title: document.title,
                    text: '好书推荐——《明朝那些事》！',
                    url: window.location.href // 自动抓取当前网页链接
                };

                try {
                    // 探测 1：检查设备是否支持原生分享面板（通常手机端支持）
                    if (navigator.share) {
                        await navigator.share(shareData);
                    } 
                    // 探测 2：如果不支持（如大部分电脑端），则降级为复制链接
                    else {
                        await navigator.clipboard.writeText(shareData.url);
                        
                        // 临时改变按钮图标，给用户视觉反馈 (打钩)
                        const icon = shareBtn.querySelector('i');
                        icon.className = 'fas fa-check text-green-500';
                        setTimeout(() => {
                            icon.className = 'fas fa-share-alt';
                        }, 2000);
                        
                        alert('链接已复制到剪贴板，快去粘贴分享吧！');
                    }
                } catch (err) {
                    console.error('分享动作被取消或发生错误:', err);
                }
            });
        }
        
        // 返回顶部按钮
        const floatingWidget = document.getElementById('floating-widget');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                floatingWidget.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
                floatingWidget.classList.add('translate-y-0', 'opacity-100');
            } else {
                floatingWidget.classList.remove('translate-y-0', 'opacity-100');
                floatingWidget.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }
        });
        document.getElementById('back-to-top').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
