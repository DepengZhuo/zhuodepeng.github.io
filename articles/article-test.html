<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章阅读 - 自动渲染测试</title>
    
    <!-- 1. 引入 Tailwind CSS 并激活官方 Typography 插件 (这行代码是排版美观的核心) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- 2. 引入 marked.js：负责把 Markdown 瞬间翻译成 HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen py-10">
    
    <div class="container mx-auto px-4 max-w-3xl">
        <a href="index.html" class="text-blue-600 hover:text-blue-800 transition flex items-center mb-8 font-medium">
            ← 返回个人主页
        </a>

        <!-- 3. 核心容器：加上 'prose' 这个类名，Tailwind 会自动接管内部所有的标题、表格、引用排版 -->
        <article id="content-container" class="prose prose-slate lg:prose-lg max-w-none bg-white p-8 md:p-12 rounded-2xl shadow-sm border border-gray-200 transition-all duration-300">
            <!-- 加载骨架屏 (网速慢时显示) -->
            <div class="animate-pulse flex space-x-4">
                <div class="flex-1 space-y-6 py-1">
                    <div class="h-6 bg-gray-200 rounded w-3/4"></div>
                    <div class="space-y-3">
                        <div class="h-4 bg-gray-200 rounded"></div>
                        <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                    </div>
                </div>
            </div>
            <p class="text-center text-gray-400 mt-6 text-sm">正在请求服务器拉取文章数据...</p>
        </article>
    </div>

    <!-- 4. 核心物理引擎：抓取文件并渲染 -->
    <script>
        // 指定我们要拉取的目标文件 (只要换这个名字，就能无限复用这个 HTML 页面)
        const targetArticle = 'mingchao.md';

        fetch(targetArticle)
            .then(response => {
                if (!response.ok) throw new Error('找不到指定的 Markdown 文件');
                return response.text();
            })
            .then(markdownText => {
                // 使用 marked 把纯文本解析成 HTML，塞进容器
                document.getElementById('content-container').innerHTML = marked.parse(markdownText);
            })
            .catch(error => {
                // 异常处理：如果是直接双击 HTML 打开的，浏览器会因为安全协议拦截 fetch 请求
                document.getElementById('content-container').innerHTML = `
                    <div class="bg-red-50 p-6 rounded-xl border border-red-200">
                        <h3 class="text-red-700 font-bold mb-2">⚠️ 本地跨域安全拦截</h3>
                        <p class="text-sm text-red-600 mb-4">
                            您的代码逻辑绝对没问题。但出于安全机制，浏览器不允许直接双击（file:// 协议）读取同目录下的文件。
                        </p>
                        <ul class="list-disc pl-5 text-sm text-red-600 space-y-1">
                            <li><strong>解法 A：</strong>推送到 GitHub Pages 上，它会自动拥有 http 协议，直接就能完美运行。</li>
                            <li><strong>解法 B：</strong>在 VS Code 中安装 "Live Server" 插件，点击右下角 "Go Live" 开启本地服务器预览。</li>
                        </ul>
                    </div>
                `;
            });
    </script>
</body>
</html>
