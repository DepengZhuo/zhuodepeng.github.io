<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岁月留痕 - Devin Zhuo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ================= 基础工具类 ================= */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* ================= 第一层：3D 目录特效 ================= */
        .perspective-1200 { perspective: 1200px; transform-style: preserve-3d; }
        .slide-item { transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); transform-origin: bottom; }
        .slide-active { transform: scale(1) rotateX(0deg); z-index: 20; }
        .slide-inactive { transform: scale(0.95) rotateX(8deg); z-index: 10; cursor: pointer; }
        .parallax-layer { transition: transform 0.15s ease-out; }
        
        /* ================= 第二层：明细画廊特效 (极致平滑过渡) ================= */
        .thumb-active { width: 120px; margin: 0 4px; opacity: 1; border: 2px solid #ffffff; } /* 选中时改为白色纯色边框 */
        .thumb-inactive { width: 48px; margin: 0; opacity: 0.5; border: 2px solid transparent; }
        
        .view-transition { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .view-hidden { opacity: 0; pointer-events: none; position: absolute; visibility: hidden; transform: translateY(30px) scale(0.98); }
        .view-visible { opacity: 1; pointer-events: auto; position: relative; visibility: visible; transform: translateY(0) scale(1); }
    </style>
</head>
<!-- 背景改为极简黑 bg-[#0a0a0a] -->
<body class="bg-[#0a0a0a] min-h-screen text-gray-100 font-sans overflow-hidden selection:bg-blue-500/30">

    <!-- 全局返回主页按钮 (暗色适配) -->
    <a href="index.html" class="fixed top-6 left-6 z-50 flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-full text-sm font-medium text-white transition-all border border-white/10 shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        返回主页
    </a>

    <!-- ================================================================= -->
    <!-- 视图 A：相册目录 (3D 轮播图)                                        -->
    <!-- ================================================================= -->
    <div id="view-directory" class="view-visible view-transition w-full h-screen flex flex-col items-center justify-center pt-10">
        <div class="mb-8 text-center">
            <!-- 标题变白 -->
            <h1 class="text-3xl font-bold tracking-widest text-white/90">岁月留痕</h1>
            <p class="text-gray-400 text-sm mt-2">选择一个相册开启回忆</p>
        </div>

        <div class="relative w-[75vmin] md:w-[450px] h-[75vmin] md:h-[450px] mx-auto perspective-1200">
            <ul id="carousel-track" class="absolute flex w-full h-full transition-transform duration-1000 ease-in-out" style="transform: translateX(0%);">
                <!-- 由 JS 渲染 -->
            </ul>

            <!-- 3D 控制按钮 (深色玻璃质感) -->
            <div class="absolute flex justify-center gap-4 w-full top-[calc(100%+2rem)]">
                <button onclick="moveDirCarousel(-1)" class="w-12 h-12 flex items-center justify-center bg-white/10 hover:bg-white/20 hover:-translate-y-1 rounded-full transition-all text-white border border-white/5">
                    <svg class="w-6 h-6 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
                <button onclick="moveDirCarousel(1)" class="w-12 h-12 flex items-center justify-center bg-white/10 hover:bg-white/20 hover:-translate-y-1 rounded-full transition-all text-white border border-white/5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- 视图 B：相册明细 (主图 + 底部缩略图)                                -->
    <!-- ================================================================= -->
    <div id="view-detail" class="view-hidden view-transition w-full h-screen flex flex-col items-center justify-center p-4 lg:p-10">
        
        <!-- 明细页头部：文字反转为纯白 -->
        <div class="w-full max-w-[1024px] flex justify-between items-center mb-6 mt-12 px-2">
            <button onclick="backToDirectory()" class="flex items-center gap-2 text-sm text-gray-400 hover:text-white transition-colors font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                返回相册列表
            </button>
            <h2 id="detail-album-title" class="text-2xl font-bold text-white tracking-wide">加载中...</h2>
        </div>

        <!-- 主图片展示区 (包含外置按钮) -->
        <div class="flex items-center justify-center w-full max-w-6xl gap-4 md:gap-8">
            
            <!-- 左侧切换按钮 (深色圆钮) -->
            <button onclick="moveDetail(-1)" class="hidden md:flex shrink-0 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white hover:scale-110 transition-all border border-white/10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>

            <!-- 核心图片框 (边框颜色变暗) -->
            <div class="relative w-full max-w-[1024px] h-[55vh] md:h-[65vh] rounded-2xl bg-gray-900 overflow-hidden shadow-2xl ring-1 ring-white/10">
                <img id="detail-main-img" src="" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-500">
                
                <!-- 计数器 (深色毛玻璃) -->
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/60 backdrop-blur-md text-white/90 px-4 py-1.5 rounded-full text-xs tracking-widest font-mono shadow-sm">
                    <span id="detail-counter">1 / 1</span>
                </div>
                
                <!-- 手机端屏幕内显示的按钮 (保证小屏可用性，深色适配) -->
                <div class="absolute inset-y-0 left-2 flex items-center md:hidden">
                    <button onclick="moveDetail(-1)" class="w-10 h-10 rounded-full bg-black/50 backdrop-blur-md flex items-center justify-center text-white shadow-md active:scale-95"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                </div>
                <div class="absolute inset-y-0 right-2 flex items-center md:hidden">
                    <button onclick="moveDetail(1)" class="w-10 h-10 rounded-full bg-black/50 backdrop-blur-md flex items-center justify-center text-white shadow-md active:scale-95"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                </div>
            </div>

            <!-- 右侧切换按钮 (深色圆钮) -->
            <button onclick="moveDetail(1)" class="hidden md:flex shrink-0 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white hover:scale-110 transition-all border border-white/10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <!-- 底部缩略图轨道 -->
        <div id="thumb-track" class="w-full max-w-[1024px] overflow-x-auto no-scrollbar py-6 mt-2">
            <div id="thumb-container" class="flex h-20 items-center justify-start min-w-max px-2">
                <!-- 由 JS 渲染 -->
            </div>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- 核心逻辑引擎                                                      -->
    <!-- ================================================================= -->
    <script>
        const albumsData = [
            {
                id: "album-1",
                coverTitle: "群山回唱",
                coverSrc: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=800&fit=crop",
                photos: [
                    "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1200&fit=crop",
                    "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=1200&fit=crop",
                    "https://images.unsplash.com/photo-1519904981063-b0cf448d479e?q=80&w=1200&fit=crop",
                    "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?q=80&w=1200&fit=crop"
                ]
            },
            {
                id: "album-2",
                coverTitle: "城市霓虹",
                coverSrc: "https://images.unsplash.com/photo-1590041794748-2d8eb73a571c?q=80&w=800&fit=crop",
                photos: [
                    "https://images.unsplash.com/photo-1590041794748-2d8eb73a571c?q=80&w=1200&fit=crop",
                    "https://images.unsplash.com/photo-1518710843675-2540dd79065c?q=80&w=1200&fit=crop",
                    "https://images.unsplash.com/photo-1494806812796-244fe51b774d?q=80&w=1200&fit=crop"
                ]
            },
            {
                id: "album-3",
                coverTitle: "荒野之息",
                coverSrc: "https://images.unsplash.com/photo-1679420437432-80cfbf88986c?q=80&w=800&fit=crop",
                photos: [
                    "https://images.unsplash.com/photo-1679420437432-80cfbf88986c?q=80&w=1200&fit=crop",
                    "https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?q=80&w=1200&fit=crop",
                    "https://images.unsplash.com/photo-1486870591958-9b9d0d1dda99?q=80&w=1200&fit=crop",
                    "https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=1200&fit=crop",
                    "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1200&fit=crop"
                ]
            }
        ];

        // --- 视图 A (目录) ---
        let currentDirIndex = 0;
        const track = document.getElementById('carousel-track');

        function initDirectory() {
            track.innerHTML = albumsData.map((album, i) => `
                <li id="dir-slide-${i}" class="slide-item flex-shrink-0 w-full h-full relative text-center text-white rounded-xl" onclick="openAlbum(${i})">
                    <div id="dir-layer-${i}" class="parallax-layer absolute inset-0 w-full h-full bg-[#1D1F2F] rounded-2xl overflow-hidden shadow-2xl border border-white/5">
                        
                        <!-- 核心修复点：使用 top-1/2 left-1/2 和 translate 完全解决黑边偏移问题 -->
                        <img src="${album.coverSrc}" class="absolute top-1/2 left-1/2 w-[120%] h-[120%] -translate-x-1/2 -translate-y-1/2 object-cover transition-opacity duration-700" id="dir-img-${i}">
                        
                        <div id="dir-overlay-${i}" class="absolute inset-0 bg-black/40 transition-opacity duration-700"></div>
                    </div>
                    <article id="dir-text-${i}" class="relative p-8 h-full flex flex-col items-center justify-center transition-opacity duration-700 pointer-events-none">
                        <h2 class="text-3xl md:text-4xl font-bold mb-6 drop-shadow-lg">${album.coverTitle}</h2>
                        <button class="pointer-events-auto px-6 py-3 bg-white text-gray-900 text-sm font-semibold rounded-full shadow-[0_4px_14px_0_rgba(0,0,0,0.1)] hover:shadow-[0_6px_20px_rgba(255,255,255,0.2)] hover:-translate-y-1 transition-all">
                            Explore Gallery
                        </button>
                    </article>
                </li>
            `).join('');
            updateDirView();
        }

        function updateDirView() {
            track.style.transform = `translateX(-${currentDirIndex * 100}%)`;
            albumsData.forEach((_, i) => {
                const el = document.getElementById(`dir-slide-${i}`);
                const img = document.getElementById(`dir-img-${i}`);
                const overlay = document.getElementById(`dir-overlay-${i}`);
                const text = document.getElementById(`dir-text-${i}`);

                if (i === currentDirIndex) {
                    el.className = "slide-item flex-shrink-0 w-full h-full relative text-center text-white rounded-xl slide-active";
                    img.style.opacity = "1";
                    overlay.classList.replace("opacity-100", "opacity-0");
                    text.classList.replace("opacity-0", "opacity-100");
                } else {
                    el.className = "slide-item flex-shrink-0 w-full h-full relative text-center text-white rounded-xl slide-inactive mx-4 md:mx-10 w-[calc(100%-2rem)] md:w-[calc(100%-5rem)]";
                    img.style.opacity = "0.5";
                    if(!overlay.classList.contains("opacity-100")) overlay.classList.add("opacity-100");
                    text.classList.replace("opacity-100", "opacity-0");
                }
            });
        }

        function moveDirCarousel(dir) {
            currentDirIndex += dir;
            if (currentDirIndex < 0) currentDirIndex = albumsData.length - 1;
            if (currentDirIndex >= albumsData.length) currentDirIndex = 0;
            updateDirView();
        }

        // --- 视图 B (明细) ---
        let activeAlbum = null;
        let currentPhotoIndex = 0;
        const thumbContainer = document.getElementById('thumb-container');
        const thumbTrack = document.getElementById('thumb-track');
        const mainImg = document.getElementById('detail-main-img');
        const counter = document.getElementById('detail-counter');

        function openAlbum(index) {
            if (index !== currentDirIndex) {
                currentDirIndex = index;
                updateDirView();
                return; 
            }

            activeAlbum = albumsData[index];
            currentPhotoIndex = 0;
            document.getElementById('detail-album-title').innerText = activeAlbum.coverTitle;
            
            thumbContainer.innerHTML = activeAlbum.photos.map((url, i) => `
                <button onclick="setPhoto(${i})" id="thumb-${i}" class="view-transition relative shrink-0 h-full rounded-md overflow-hidden ${i === 0 ? 'thumb-active' : 'thumb-inactive'}">
                    <img src="${url}" class="w-full h-full object-cover pointer-events-none select-none">
                </button>
            `).join('');

            document.getElementById('view-directory').className = 'view-hidden view-transition w-full h-screen flex flex-col items-center justify-center pt-10';
            document.getElementById('view-detail').className = 'view-visible view-transition w-full h-screen flex flex-col items-center justify-center p-4 lg:p-10';
            
            updatePhotoView();
        }

        function backToDirectory() {
            document.getElementById('view-detail').className = 'view-hidden view-transition w-full h-screen flex flex-col items-center justify-center p-4 lg:p-10';
            document.getElementById('view-directory').className = 'view-visible view-transition w-full h-screen flex flex-col items-center justify-center pt-10';
        }

        function setPhoto(index) {
            currentPhotoIndex = index;
            updatePhotoView();
        }

        function moveDetail(dir) {
            if(!activeAlbum) return;
            currentPhotoIndex += dir;
            if (currentPhotoIndex < 0) currentPhotoIndex = activeAlbum.photos.length - 1;
            if (currentPhotoIndex >= activeAlbum.photos.length) currentPhotoIndex = 0;
            updatePhotoView();
        }

        function updatePhotoView() {
            if(!activeAlbum) return;
            
            mainImg.style.opacity = 0.2;
            setTimeout(() => {
                mainImg.src = activeAlbum.photos[currentPhotoIndex];
                mainImg.style.opacity = 1;
            }, 200);

            counter.innerText = `${currentPhotoIndex + 1} / ${activeAlbum.photos.length}`;

            // 暗黑模式下，未激活的缩略图边框颜色适配
            activeAlbum.photos.forEach((_, i) => {
                const btn = document.getElementById(`thumb-${i}`);
                if (i === currentPhotoIndex) {
                    btn.className = "view-transition relative shrink-0 h-full rounded-md overflow-hidden thumb-active shadow-md";
                } else {
                    btn.className = "view-transition relative shrink-0 h-full rounded-md overflow-hidden hover:opacity-80 thumb-inactive ring-1 ring-white/10";
                }
            });

            const activeThumb = document.getElementById(`thumb-${currentPhotoIndex}`);
            const scrollPos = activeThumb.offsetLeft - (thumbTrack.offsetWidth / 2) + (activeThumb.offsetWidth / 2);
            thumbTrack.scrollTo({ left: scrollPos, behavior: 'smooth' });
        }

        initDirectory();
    </script>
</body>
</html>
