<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指数估值与定投决策计算器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 font-sans">
    <div id="app" class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <div class="bg-blue-600 px-6 py-5 text-white">
            <h1 class="text-2xl font-bold text-center">📊 指数估值与定投决策计算器</h1>
            <p class="text-xs text-blue-100 text-center mt-1">数据状态：每日收盘自动更新</p>
        </div>

        <div class="p-6 space-y-6">

            <!-- 1. 选择策略 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">1. 选择计算策略：</label>
                <select v-model="selectedStrategy" @change="onStrategyChange" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="EARNINGS_YIELD">策略一：盈利收益率法（成熟高股息指数，如上证50/红利）</option>
                    <option value="BOGLE_PE">策略二：博格公式 - PE版（宽基/成长指数，如沪深300/消费）</option>
                    <option value="BOGLE_PB">策略三：博格公式 - PB版（周期性/金融行业，如证券/银行）</option>
                </select>
            </div>

            <!-- 2. 选择指数 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">2. 选择对应指数：</label>
                <select v-model="selectedIndex" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option v-for="(item, idx) in availableIndices" :key="idx" :value="idx">
                        {{ item.name }} ({{ item.code }})
                    </option>
                </select>
            </div>

            <!-- 3. 数据参数可微调 -->
            <div v-if="currentData" class="space-y-4 border-t pt-4">
                <h3 class="text-sm font-semibold text-slate-700">3. 今日市场指标（自动带出，支持微调）：</h3>
                
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <div v-if="selectedStrategy !== 'BOGLE_PB'" class="bg-slate-50 p-3 rounded-lg border">
                        <label class="block text-xs text-slate-500 mb-1">市盈率 (PE)</label>
                        <input v-model.number="currentData.pe" type="number" step="0.1" class="w-full bg-white border rounded px-2 py-1 text-sm font-bold">
                    </div>

                    <div v-if="selectedStrategy === 'BOGLE_PB'" class="bg-slate-50 p-3 rounded-lg border">
                        <label class="block text-xs text-slate-500 mb-1">市净率 (PB)</label>
                        <input v-model.number="currentData.pb" type="number" step="0.01" class="w-full bg-white border rounded px-2 py-1 text-sm font-bold">
                    </div>

                    <div v-if="selectedStrategy === 'BOGLE_PE'" class="bg-slate-50 p-3 rounded-lg border">
                        <label class="block text-xs text-slate-500 mb-1">PE 历史百分位 (%)</label>
                        <input v-model.number="currentData.pePct" type="number" class="w-full bg-white border rounded px-2 py-1 text-sm font-bold">
                    </div>

                    <div v-if="selectedStrategy === 'BOGLE_PB'" class="bg-slate-50 p-3 rounded-lg border">
                        <label class="block text-xs text-slate-500 mb-1">PB 历史百分位 (%)</label>
                        <input v-model.number="currentData.pbPct" type="number" class="w-full bg-white border rounded px-2 py-1 text-sm font-bold">
                    </div>

                    <div class="bg-slate-50 p-3 rounded-lg border">
                        <label class="block text-xs text-slate-500 mb-1">股息率 (%)</label>
                        <input v-model.number="currentData.dv" type="number" step="0.1" class="w-full bg-white border rounded px-2 py-1 text-sm font-bold">
                    </div>
                </div>
            </div>

            <!-- 4. 评估结果 -->
            <div v-if="currentData" class="space-y-4 border-t pt-4">
                <h3 class="text-sm font-semibold text-slate-700">4. 决策建议：</h3>
                
                <div class="p-4 rounded-xl border" :class="resultStyle.box">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-lg font-bold" :class="resultStyle.titleText">{{ result.signalText }}</span>
                        <span class="text-xs px-2.5 py-1 rounded-full font-medium" :class="resultStyle.badge">{{ result.statusTag }}</span>
                    </div>
                    <p class="text-sm text-slate-600 mb-2">{{ result.reason }}</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue

        createApp({
            setup() {
                const rawData = ref(null)
                const selectedStrategy = ref('EARNINGS_YIELD')
                const selectedIndex = ref(0)

                // 从仓库拉取自动更新的 json 文件
                onMounted(async () => {
                    try {
                        const res = await fetch('./data.json')
                        rawData.value = await res.json()
                    } catch (e) {
                        console.log('读取 local json 异常，使用保底数据')
                    }
                })

                const availableIndices = computed(() => {
                    if (!rawData.value) return []
                    return rawData.value[selectedStrategy.value] || []
                })

                const currentData = computed(() => {
                    if (availableIndices.value.length === 0) return null
                    return availableIndices.value[selectedIndex.value] || availableIndices.value[0]
                })

                const onStrategyChange = () => {
                    selectedIndex.value = 0
                }

                // 计算决策
                const result = computed(() => {
                    if (!currentData.value) return {}
                    const item = currentData.value

                    if (selectedStrategy.value === 'EARNINGS_YIELD') {
                        const ey = item.pe > 0 ? (1 / item.pe) * 100 : 0
                        if (ey > 10) return { signal: 'BUY', statusTag: '低估', signalText: '🟢 建议买入 / 定投', reason: `当前盈利收益率 ${ey.toFixed(2)}% > 10%，性价比极高。` }
                        if (ey < 6.4) return { signal: 'SELL', statusTag: '高估', signalText: '🔴 建议止盈 / 卖出', reason: `当前盈利收益率 ${ey.toFixed(2)}% < 6.4%，进入高估风险区。` }
                        return { signal: 'HOLD', statusTag: '合理', signalText: '🟡 建议持有', reason: `当前盈利收益率 ${ey.toFixed(2)}% 估值合理。` }
                    } else if (selectedStrategy.value === 'BOGLE_PE') {
                        if (item.pePct <= 30) return { signal: 'BUY', statusTag: '低估', signalText: '🟢 建议买入 / 定投', reason: `PE 历史百分位仅为 ${item.pePct}% (≤30%)，处于低估吸筹期。` }
                        if (item.pePct >= 70) return { signal: 'SELL', statusTag: '高估', signalText: '🔴 建议止盈 / 卖出', reason: `PE 历史百分位达 ${item.pePct}% (≥70%)，建议分批分场。` }
                        return { signal: 'HOLD', statusTag: '合理', signalText: '🟡 建议持有', reason: `PE 历史百分位 ${item.pePct}% 处于中枢区间。` }
                    } else {
                        if (item.pbPct <= 20) return { signal: 'BUY', statusTag: '周期底部', signalText: '🟢 建议买入', reason: `PB 历史百分位仅为 ${item.pbPct}% (≤20%)，极具安全边际。` }
                        if (item.pbPct >= 70) return { signal: 'SELL', statusTag: '周期顶部', signalText: '🔴 建议止盈', reason: `PB 历史百分位达 ${item.pbPct}% (≥70%)，周期顶部见好就收。` }
                        return { signal: 'HOLD', statusTag: '合理', signalText: '🟡 建议持有', reason: `PB 历史百分位 ${item.pbPct}% 处于合理周期。` }
                    }
                })

                const resultStyle = computed(() => {
                    const sig = result.value.signal
                    if (sig === 'BUY') return { box: 'bg-emerald-50 border-emerald-200', titleText: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' }
                    if (sig === 'SELL') return { box: 'bg-rose-50 border-rose-200', titleText: 'text-rose-800', badge: 'bg-rose-200 text-rose-800' }
                    return { box: 'bg-amber-50 border-amber-200', titleText: 'text-amber-800', badge: 'bg-amber-200 text-amber-800' }
                })

                return { selectedStrategy, selectedIndex, availableIndices, currentData, result, resultStyle, onStrategyChange }
            }
        }).mount('#app')
    </script>
</body>
</html>
