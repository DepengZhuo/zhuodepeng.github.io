<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指数估值与定投决策计算器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 font-sans text-slate-800">
    <div id="app" class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <div class="bg-blue-600 px-6 py-5 text-white">
            <h1 class="text-2xl font-bold text-center">📊 指数估值与定投决策计算器 (实盘API版)</h1>
            <p class="text-xs text-blue-100 text-center mt-1">数据直连：东方财富实时接口 | 绕过跨域限制</p>
        </div>

        <div class="p-6 space-y-6">

            <!-- 1. 选择策略 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">1. 选择计算策略：</label>
                <select v-model="selectedStrategy" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                    <option value="EARNINGS_YIELD">策略一：盈利收益率法（成熟高股息：上证50/红利等）</option>
                    <option value="BOGLE_PE">策略二：博格公式 - PE版（成长/宽基：沪深300/消费/医药等）</option>
                    <option value="BOGLE_PB">策略三：博格公式 - PB版（强周期/金融：证券/银行/地产等）</option>
                </select>
            </div>

            <!-- 2. 选择指数 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">2. 选择对应指数：</label>
                <select v-model="selectedCode" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500 font-medium">
                    <option v-for="item in availableIndices" :key="item.code" :value="item.code">
                        {{ item.name }} ({{ item.code }})
                    </option>
                </select>
            </div>

            <!-- 3. 数据参数面板 -->
            <div class="space-y-4 border-t pt-5">
                <div class="flex justify-between items-end">
                    <h3 class="text-sm font-semibold text-slate-700">3. 市场指标 (PE/PB 为实时抓取)：</h3>
                    <span v-if="isFetching" class="text-xs bg-yellow-100 text-yellow-700 px-2 py-1 rounded animate-pulse">📡 正在连接东财接口...</span>
                    <span v-else class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">✅ 已拉取最新实时数据</span>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div v-if="selectedStrategy !== 'BOGLE_PB'" class="bg-blue-50 p-3 rounded-lg border border-blue-200">
                        <label class="block text-xs text-slate-600 mb-1">实时市盈率 (PE) <span class="text-red-500">*</span></label>
                        <input v-model.number="params.pe" type="number" step="0.1" class="w-full bg-white border rounded px-2 py-1.5 text-sm font-bold text-blue-700 focus:outline-none">
                    </div>

                    <div v-if="selectedStrategy === 'BOGLE_PB'" class="bg-blue-50 p-3 rounded-lg border border-blue-200">
                        <label class="block text-xs text-slate-600 mb-1">实时市净率 (PB) <span class="text-red-500">*</span></label>
                        <input v-model.number="params.pb" type="number" step="0.01" class="w-full bg-white border rounded px-2 py-1.5 text-sm font-bold text-blue-700 focus:outline-none">
                    </div>

                    <div v-if="selectedStrategy === 'BOGLE_PE'" class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs text-slate-500 mb-1">PE 分位数 (%)</label>
                        <input v-model.number="params.pePct" type="number" class="w-full bg-white border rounded px-2 py-1.5 text-sm font-bold text-slate-700 focus:outline-none">
                    </div>

                    <div v-if="selectedStrategy === 'BOGLE_PB'" class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs text-slate-500 mb-1">PB 分位数 (%)</label>
                        <input v-model.number="params.pbPct" type="number" class="w-full bg-white border rounded px-2 py-1.5 text-sm font-bold text-slate-700 focus:outline-none">
                    </div>

                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs text-slate-500 mb-1">股息率 (%)</label>
                        <input v-model.number="params.dv" type="number" step="0.1" class="w-full bg-white border rounded px-2 py-1.5 text-sm font-bold text-slate-700 focus:outline-none">
                    </div>

                    <div v-if="selectedStrategy === 'BOGLE_PE'" class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs text-slate-500 mb-1">预期盈利增长 (%)</label>
                        <input v-model.number="params.eg" type="number" step="0.1" class="w-full bg-white border rounded px-2 py-1.5 text-sm font-bold text-slate-700 focus:outline-none">
                    </div>
                    
                    <div v-if="selectedStrategy === 'BOGLE_PB'" class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs text-slate-500 mb-1">预期净资产增长 (%)</label>
                        <input v-model.number="params.nag" type="number" step="0.1" class="w-full bg-white border rounded px-2 py-1.5 text-sm font-bold text-slate-700 focus:outline-none">
                    </div>
                </div>

                <div class="mt-6 text-center pt-4">
                    <button @click="doCalculate" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-12 rounded-full shadow-lg transition-transform transform active:scale-95 text-lg">
                        🚀 开始计算决策
                    </button>
                </div>
            </div>

            <!-- 动态渲染区：点击计算后显示 -->
            <div v-if="hasCalculated" class="space-y-6 animate-fade-in-up mt-6">
                
                <!-- 4. 评估结果 -->
                <div class="border-t pt-5">
                    <h3 class="text-sm font-semibold text-slate-700 mb-3">4. 最终决策建议：</h3>
                    <div class="p-5 rounded-xl border-2 shadow-sm bg-white" :class="calcResult.style.box">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xl font-bold flex items-center gap-2" :class="calcResult.style.titleText">
                                {{ calcResult.signalText }}
                            </span>
                            <span class="text-sm px-3 py-1 rounded-full font-bold shadow-sm" :class="calcResult.style.badge">
                                {{ calcResult.statusTag }}
                            </span>
                        </div>
                        <p class="text-slate-700 mt-2 font-medium leading-relaxed">{{ calcResult.reason }}</p>
                    </div>
                </div>

                <!-- 5. 计算推导过程 -->
                <div class="border-t pt-5">
                    <h3 class="text-sm font-semibold text-slate-700 mb-3">5. 完整计算推导过程：</h3>
                    <div class="bg-slate-800 text-slate-300 p-5 rounded-xl text-sm font-mono leading-relaxed shadow-inner overflow-x-auto border border-slate-700">
                        
                        <template v-if="selectedStrategy === 'EARNINGS_YIELD'">
                            <p class="text-blue-300 font-bold mb-3 border-b border-slate-600 pb-2">// 盈利收益率法计算公式</p>
                            <p>1. 提取当前市盈率(PE) = <span class="text-green-400">{{ params.pe }}</span></p>
                            <p>2. 计算盈利收益率 = ( 1 / PE ) * 100%</p>
                            <p>3. 实际计算 = ( 1 / {{ params.pe }} ) * 100% = <span class="text-yellow-400 font-bold text-base">{{ calcResult.eyValue }}%</span></p>
                            <div class="mt-4 border-t border-slate-600 pt-3 text-xs text-slate-400">
                                * 判定规则说明：<br>
                                • 大于 10% ➔ 低估买入区<br>
                                • 6.4% ~ 10% ➔ 合理持有区<br>
                                • 小于 6.4% ➔ 高估卖出区
                            </div>
                        </template>

                        <template v-if="selectedStrategy === 'BOGLE_PE'">
                            <p class="text-blue-300 font-bold mb-3 border-b border-slate-600 pb-2">// 博格公式 (PE版) 预估年化收益</p>
                            <p>基本公式 = 股息率 + 盈利增长率 + 估值变化修复</p>
                            <div class="space-y-1 my-3">
                                <p>1. 基础收益 = {{ params.dv }}% (股息) + {{ params.eg }}% (增长) = <span class="text-green-400">{{ (params.dv + params.eg).toFixed(2) }}%</span></p>
                                <p>2. 估值分位 = {{ params.pePct }}% (距离50%均值空间为：{{ (50 - params.pePct).toFixed(2) }}%)</p>
                                <p>3. 估值修复(按3年回归折算) = ({{ (50 - params.pePct).toFixed(2) }} / 3年) * 0.4系数 = <span class="text-blue-400">{{ calcResult.valuationFix }}%</span></p>
                            </div>
                            <p class="mt-4 text-white font-bold border-t border-slate-600 pt-3 text-base">
                                总预估年化收益 ≈ <span class="text-yellow-400">{{ calcResult.expectedReturn }}%</span>
                            </p>
                        </template>

                        <template v-if="selectedStrategy === 'BOGLE_PB'">
                            <p class="text-blue-300 font-bold mb-3 border-b border-slate-600 pb-2">// 博格公式 (PB版) 预估年化收益</p>
                            <p>基本公式 = 股息率 + 净资产增长率 + 估值变化修复</p>
                            <div class="space-y-1 my-3">
                                <p>1. 基础收益 = {{ params.dv }}% (股息) + {{ params.nag }}% (增长) = <span class="text-green-400">{{ (params.dv + params.nag).toFixed(2) }}%</span></p>
                                <p>2. 估值分位 = {{ params.pbPct }}% (距离50%均值空间为：{{ (50 - params.pbPct).toFixed(2) }}%)</p>
                                <p>3. 估值修复(按2年回归折算) = ({{ (50 - params.pbPct).toFixed(2) }} / 2年) * 0.6系数 = <span class="text-blue-400">{{ calcResult.valuationFix }}%</span></p>
                            </div>
                            <p class="mt-4 text-white font-bold border-t border-slate-600 pt-3 text-base">
                                周期爆发预估年化 ≈ <span class="text-yellow-400">{{ calcResult.expectedReturn }}%</span>
                            </p>
                        </template>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <style>
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script>
        const { createApp, ref, computed, reactive, watch, onMounted } = Vue

        createApp({
            setup() {
                // 数据库新增 secid，这是直接调用东方财富API所需的核心参数
                const indexDatabase = {
                    EARNINGS_YIELD: [
                        { name: "上证50", code: "000016", secid: "1.000016", pePct: 35, pbPct: 30, dv: 3.8 },
                        { name: "上证红利", code: "000015", secid: "1.000015", pePct: 15, pbPct: 20, dv: 5.5 },
                        { name: "中证红利", code: "000922", secid: "1.000922", pePct: 18, pbPct: 22, dv: 5.1 }
                    ],
                    BOGLE_PE: [
                        { name: "沪深300", code: "000300", secid: "1.000300", pePct: 25, pbPct: 28, dv: 3.0, eg: 7.5 },
                        { name: "中证500", code: "399905", secid: "0.399905", pePct: 18, pbPct: 22, dv: 1.8, eg: 9.0 },
                        { name: "创业板指", code: "399006", secid: "0.399006", pePct: 12, pbPct: 15, dv: 1.2, eg: 12.0 },
                        { name: "主要消费", code: "000036", secid: "1.000036", pePct: 22, pbPct: 30, dv: 2.5, eg: 8.5 }
                    ],
                    BOGLE_PB: [
                        { name: "证券公司", code: "399975", secid: "0.399975", pePct: 40, pbPct: 12, dv: 1.5, nag: 6.0 },
                        { name: "中证银行", code: "399986", secid: "0.399986", pePct: 30, pbPct: 15, dv: 5.2, nag: 5.0 },
                        { name: "地产等权", code: "399983", secid: "0.399983", pePct: 50, pbPct: 8, dv: 3.0, nag: 2.0 }
                    ]
                }

                const selectedStrategy = ref('BOGLE_PE')
                const selectedCode = ref('000300')
                const hasCalculated = ref(false) 
                const isFetching = ref(false)

                const params = reactive({
                    pe: 0, pb: 0, pePct: 25, pbPct: 28, dv: 3.0, eg: 7.5, nag: 6.0
                })

                const availableIndices = computed(() => indexDatabase[selectedStrategy.value] || [])

                // JSONP 跨域请求东方财富实时数据接口
                const fetchEastMoneyRealTime = (secid) => {
                    return new Promise((resolve, reject) => {
                        const cbName = 'jsonp_callback_' + Math.round(100000 * Math.random());
                        window[cbName] = function(data) {
                            delete window[cbName];
                            document.body.removeChild(script);
                            resolve(data);
                        };
                        const script = document.createElement('script');
                        // f162 = 动态市盈率, f167 = 市净率
                        script.src = `https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f162,f167&cb=${cbName}`;
                        script.onerror = () => reject(new Error('Network error'));
                        document.body.appendChild(script);
                    });
                };

                // 更新参数引擎
                const updateParamsFromCode = async (code) => {
                    const target = availableIndices.value.find(i => i.code === code)
                    if (!target) return;

                    // 加载基础数据
                    params.pePct = target.pePct;
                    params.pbPct = target.pbPct;
                    params.dv = target.dv;
                    params.eg = target.eg || 7.5;
                    params.nag = target.nag || 6.0;

                    // 触发 JSONP 拉取实时 PE/PB
                    isFetching.value = true;
                    try {
                        const apiData = await fetchEastMoneyRealTime(target.secid);
                        if(apiData && apiData.data) {
                            // 东财接口数据默认放大了 100 倍，需除以 100
                            params.pe = apiData.data.f162 ? parseFloat((apiData.data.f162 / 100).toFixed(2)) : 0;
                            params.pb = apiData.data.f167 ? parseFloat((apiData.data.f167 / 100).toFixed(2)) : 0;
                        }
                    } catch (error) {
                        console.error('获取实时数据失败，请检查网络');
                    } finally {
                        isFetching.value = false;
                    }
                }

                // 页面加载完成后立即初始化第一次参数
                onMounted(() => {
                    updateParamsFromCode(selectedCode.value)
                })

                watch(selectedStrategy, () => {
                    if (availableIndices.value.length > 0) {
                        selectedCode.value = availableIndices.value[0].code
                    }
                })

                watch(selectedCode, (newCode) => {
                    hasCalculated.value = false; // 切换指标时重置页面状态
                    updateParamsFromCode(newCode)
                })

                // 任何参数修改，立即折叠计算结果（强制要求重新点击计算）
                watch(params, () => {
                    hasCalculated.value = false
                }, { deep: true })

                const doCalculate = () => {
                    hasCalculated.value = true
                }

                const calcResult = computed(() => {
                    let sig = 'HOLD', tag = '合理', text = '🟡 建议持有', reason = '', eyValue = 0, expRet = 0, valFix = 0;

                    if (selectedStrategy.value === 'EARNINGS_YIELD') {
                        eyValue = params.pe > 0 ? ((1 / params.pe) * 100).toFixed(2) : 0
                        if (eyValue > 10) {
                            sig = 'BUY'; tag = '低估'; text = '🟢 建议买入 / 定投';
                            reason = `当前盈利收益率 ${eyValue}% 远大于 10% 黄金标准，性价比极高，安全边际充足。`
                        } else if (eyValue < 6.4) {
                            sig = 'SELL'; tag = '高估'; text = '🔴 建议止盈 / 卖出';
                            reason = `当前盈利收益率 ${eyValue}% 低于 6.4% 警戒线（等同市盈率超15.6），进入高估风险区。`
                        } else {
                            sig = 'HOLD'; tag = '合理'; text = '🟡 建议观望 / 持现';
                            reason = `当前盈利收益率 ${eyValue}% 处于 6.4%~10% 的合理中枢，保持现有仓位。`
                        }
                    } 
                    else if (selectedStrategy.value === 'BOGLE_PE') {
                        valFix = params.pePct < 50 ? ((50 - params.pePct) / 3 * 0.4) : ((50 - params.pePct) / 3 * 0.4);
                        expRet = (params.dv + params.eg + valFix).toFixed(2);
                        valFix = valFix.toFixed(2);

                        if (params.pePct <= 30) {
                            sig = 'BUY'; tag = '历史低估'; text = '🟢 建议买入 / 定投';
                            reason = `PE 历史分位数仅为 ${params.pePct}% (≤30%)，具备极强估值优势，预估未来年化收益可达 ${expRet}%。`
                        } else if (params.pePct >= 70) {
                            sig = 'SELL'; tag = '历史高估'; text = '🔴 建议分批止盈';
                            reason = `PE 历史分位数达 ${params.pePct}% (≥70%)，估值被透支，预估收益率下降，建议落袋为安。`
                        } else {
                            sig = 'HOLD'; tag = '合理估值'; text = '🟡 建议持有';
                            reason = `PE 历史分位数 ${params.pePct}% 处于历史均值附近，未见明显套利空间。`
                        }
                    } 
                    else {
                        valFix = params.pbPct < 50 ? ((50 - params.pbPct) / 2 * 0.6) : ((50 - params.pbPct) / 2 * 0.6);
                        expRet = (params.dv + params.nag + valFix).toFixed(2);
                        valFix = valFix.toFixed(2);

                        if (params.pbPct <= 20) {
                            sig = 'BUY'; tag = '周期底部'; text = '🟢 建议逢低建仓';
                            reason = `PB 历史分位数仅为 ${params.pbPct}% (≤20%)，身处周期绝对底部，下行风险极小。`
                        } else if (params.pbPct >= 70) {
                            sig = 'SELL'; tag = '周期顶部'; text = '🔴 坚决止盈卖出';
                            reason = `PB 历史分位数达 ${params.pbPct}% (≥70%)，周期股见顶极快，切勿留恋，果断离场。`
                        } else {
                            sig = 'HOLD'; tag = '周期中部'; text = '🟡 建议持有等待';
                            reason = `PB 历史分位数 ${params.pbPct}% 处于周期爬坡期，继续持有。`
                        }
                    }

                    const style = {
                        box: sig === 'BUY' ? 'border-emerald-400 bg-emerald-50' : (sig === 'SELL' ? 'border-rose-400 bg-rose-50' : 'border-amber-400 bg-amber-50'),
                        titleText: sig === 'BUY' ? 'text-emerald-700' : (sig === 'SELL' ? 'text-rose-700' : 'text-amber-700'),
                        badge: sig === 'BUY' ? 'bg-emerald-500 text-white' : (sig === 'SELL' ? 'bg-rose-500 text-white' : 'bg-amber-500 text-white')
                    }

                    return { signalText: text, statusTag: tag, reason, eyValue, expectedReturn: expRet, valuationFix: valFix, style }
                })

                return { selectedStrategy, selectedCode, availableIndices, params, calcResult, hasCalculated, isFetching, doCalculate }
            }
        }).mount('#app')
    </script>
</body>
</html>
